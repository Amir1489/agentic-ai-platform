name: Backend API tests
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify Alembic baseline is repeatable
        run: |
          export DATABASE_URL=sqlite:////tmp/agentic-existing-schema.db
          python -c "from app.database import Base, engine; from app import models; Base.metadata.create_all(bind=engine)"
          alembic upgrade head
          alembic upgrade head
          export DATABASE_URL=sqlite:////tmp/agentic-fresh-schema.db
          alembic upgrade head
      - run: python -m pytest -q tests
      - name: Verify migrations and concurrent claims on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentic_test
        run: |
          alembic upgrade head
          python -m pytest -q tests/test_agent_worker_postgres.py
